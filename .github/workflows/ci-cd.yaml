name: CI/CD Pipeline & Rollback

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: 'Bajariladigan amal (deploy yoki rollback)'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - rollback

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  test:
    name: Backend & Frontend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: neoavlod
          POSTGRES_DB: neoavlod_test
          POSTGRES_PASSWORD: test_password_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neoavlod -d neoavlod_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Backend Test & Quality Gate
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Backend Lint & Typecheck
        run: |
          ruff check backend
          ruff format --check backend
          mypy backend/src backend/tests

      - name: Run Alembic Migrations and Pytest
        env:
          NEOAVLOD_ENVIRONMENT: test
          NEOAVLOD_DATABASE_URL: postgresql+asyncpg://neoavlod:test_password_123@localhost:5432/neoavlod_test
          TEST_DATABASE_URL: postgresql+asyncpg://neoavlod:test_password_123@localhost:5432/neoavlod_test
          NEOAVLOD_SECURITY_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          NEOAVLOD_BOT_ENCRYPTION_KEY: G1V8g_d1qPZ5x8kQ7j7oG8m_g7kY4b1wX6d2k8r1t0w=
        run: |
          cd backend
          alembic upgrade head
          pytest -v

      # Frontend Test & Build Gate
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Frontend Typecheck
        run: |
          cd frontend
          npm run typecheck

      - name: Frontend Lint
        run: |
          cd frontend
          npm run lint

      - name: Frontend Tests
        run: |
          cd frontend
          npm test

      - name: Build Frontend Bundles
        run: |
          cd frontend
          npm run build

      - name: Upload frontend build artifacts
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy'))
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: |
            frontend/apps/admin/dist
            frontend/apps/teacher/dist
          retention-days: 7

  deploy:
    name: Production Deployment
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frontend build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Configure pinned SSH host
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Execute atomic release deployment
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          chmod +x scripts/deploy/*.sh
          ./scripts/deploy/remote_deploy.sh

  rollback:
    name: Production Rollback
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure pinned SSH host
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Execute release rollback on server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "sudo /opt/neoavlod/scripts/rollback.sh"
