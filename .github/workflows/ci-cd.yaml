name: NeoAvlod CI and Production Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: deploy or rollback
        required: true
        default: deploy
        type: choice
        options: [deploy, rollback]

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'workflow_dispatch' || inputs.action != 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Docker test environment
        run: scripts/agent_skills/docker_env.sh up
      - name: Backend quality, isolated PostgreSQL tests and migrations
        run: |
          scripts/agent_skills/check_backend.sh
          scripts/agent_skills/run_migrations.sh
          scripts/agent_skills/check_agent_skills.sh
      - name: Frontend quality and verify locally committed production build
        run: |
          scripts/agent_skills/docker_env.sh node bash -c 'npm ci && npm run typecheck && npm run lint && npm test && npm run build && node prepare-release.mjs --check'
      - name: Deploy and rollback regression
        run: scripts/agent_skills/smoke_cicd_rollback.sh
      - name: Nginx compatibility and portal smoke
        run: scripts/agent_skills/smoke_nginx.sh
      - name: Disposable production release integration
        run: scripts/agent_skills/smoke_release_deployment.sh
      - name: Cleanup disposable development containers
        if: always()
        run: docker compose --env-file .env -f compose.yaml down --remove-orphans

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: neoavlod-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Configure pinned server identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/neoavlod_ci
          chmod 600 ~/.ssh/neoavlod_ci
          ssh-keygen -y -P '' -f ~/.ssh/neoavlod_ci > /dev/null
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy tested backend and committed frontends
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
          RELEASE_ID: ${{ github.sha }}
        run: scripts/deploy/remote_deploy.sh

  rollback:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.action == 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: neoavlod-production
      cancel-in-progress: false
    steps:
      - name: Configure pinned server identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/neoavlod_ci
          chmod 600 ~/.ssh/neoavlod_ci
          ssh-keygen -y -P '' -f ~/.ssh/neoavlod_ci > /dev/null
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Restore previous backend image and both frontend releases
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          test -n "$SSH_USER" && test -n "$SSH_HOST"
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes -o IdentitiesOnly=yes -i ~/.ssh/neoavlod_ci "$SSH_USER@$SSH_HOST" rollback
