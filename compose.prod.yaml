name: neoavlod-prod

services:
  database:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neoavlod}
      POSTGRES_DB: ${POSTGRES_DB:-neoavlod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  migrations:
    image: neoavlod-backend:${NEOAVLOD_RELEASE_ID:-production}
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    restart: "no"
    user: "1000:1000"
    healthcheck:
      disable: true
    environment:
      NEOAVLOD_ENVIRONMENT: production
      NEOAVLOD_DATABASE_URL: ${NEOAVLOD_DATABASE_URL:?NEOAVLOD_DATABASE_URL must be set}
      NEOAVLOD_REDIS_URL: ${NEOAVLOD_REDIS_URL:-redis://redis:6379/0}
      NEOAVLOD_SECURITY_SECRET: ${NEOAVLOD_SECURITY_SECRET:?NEOAVLOD_SECURITY_SECRET must be set}
      NEOAVLOD_BOT_ENCRYPTION_KEY: ${NEOAVLOD_BOT_ENCRYPTION_KEY:?NEOAVLOD_BOT_ENCRYPTION_KEY must be set}
      NEOAVLOD_ADMIN_ORIGIN: ${NEOAVLOD_ADMIN_ORIGIN:-https://admin.eduneo.uz}
      NEOAVLOD_TEACHER_ORIGIN: ${NEOAVLOD_TEACHER_ORIGIN:-https://teacher.eduneo.uz}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      database:
        condition: service_healthy

  audit-archiver:
    image: neoavlod-backend:${NEOAVLOD_RELEASE_ID:-production}
    restart: unless-stopped
    init: true
    user: "1000:1000"
    deploy:
      replicas: 1
    volumes:
      - type: bind
        source: ${NEOAVLOD_AUDIT_HOST_DIR:-/opt/neoavlod/audit-logs}
        target: /app/audit-logs
    environment:
      NEOAVLOD_ENVIRONMENT: production
      NEOAVLOD_SERVICE_ROLE: archive
      NEOAVLOD_DATABASE_URL: ${NEOAVLOD_ARCHIVE_DATABASE_URL:?Restricted archive database URL must be set}
      NEOAVLOD_AUDIT_DIR: /app/audit-logs
      NEOAVLOD_AUDIT_ENCRYPTION_KEY: ${NEOAVLOD_AUDIT_ENCRYPTION_KEY:?Stable audit key must be set}
      NEOAVLOD_AUDIT_KEY_ID: ${NEOAVLOD_AUDIT_KEY_ID:-v1}
      NEOAVLOD_AUDIT_PREVIOUS_KEYS: ${NEOAVLOD_AUDIT_PREVIOUS_KEYS:-}
    command: ["python", "-m", "neoavlod.audit_archiver"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time; assert time.time()-os.stat('/tmp/neoavlod-audit-heartbeat').st_mtime < 45"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      database:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  api:
    image: neoavlod-backend:${NEOAVLOD_RELEASE_ID:-production}
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - media-data:/app/media
      - type: bind
        source: ${NEOAVLOD_AUDIT_HOST_DIR:-/opt/neoavlod/audit-logs}
        target: /app/audit-logs
        read_only: true
    environment:
      NEOAVLOD_ENVIRONMENT: production
      NEOAVLOD_MEDIA_DIR: /app/media
      NEOAVLOD_DATABASE_URL: ${NEOAVLOD_APP_DATABASE_URL:?Restricted app database URL must be set}
      NEOAVLOD_AUDIT_DIR: /app/audit-logs
      NEOAVLOD_AUDIT_ENCRYPTION_KEY: ${NEOAVLOD_AUDIT_ENCRYPTION_KEY:?Stable audit key must be set}
      NEOAVLOD_AUDIT_KEY_ID: ${NEOAVLOD_AUDIT_KEY_ID:-v1}
      NEOAVLOD_AUDIT_PREVIOUS_KEYS: ${NEOAVLOD_AUDIT_PREVIOUS_KEYS:-}
      NEOAVLOD_REDIS_URL: ${NEOAVLOD_REDIS_URL:-redis://redis:6379/0}
      NEOAVLOD_SECURITY_SECRET: ${NEOAVLOD_SECURITY_SECRET:?NEOAVLOD_SECURITY_SECRET must be set}
      NEOAVLOD_BOT_ENCRYPTION_KEY: ${NEOAVLOD_BOT_ENCRYPTION_KEY:?NEOAVLOD_BOT_ENCRYPTION_KEY must be set}
      NEOAVLOD_ADMIN_ORIGIN: ${NEOAVLOD_ADMIN_ORIGIN:-https://admin.eduneo.uz}
      NEOAVLOD_TEACHER_ORIGIN: ${NEOAVLOD_TEACHER_ORIGIN:-https://teacher.eduneo.uz}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)\" || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  worker:
    image: neoavlod-backend:${NEOAVLOD_RELEASE_ID:-production}
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    restart: unless-stopped
    user: "1000:1000"
    healthcheck:
      disable: true
    deploy:
      replicas: 1
    environment:
      NEOAVLOD_ENVIRONMENT: production
      NEOAVLOD_DATABASE_URL: ${NEOAVLOD_APP_DATABASE_URL:?Restricted app database URL must be set}
      NEOAVLOD_REDIS_URL: ${NEOAVLOD_REDIS_URL:-redis://redis:6379/0}
      NEOAVLOD_SECURITY_SECRET: ${NEOAVLOD_SECURITY_SECRET:?NEOAVLOD_SECURITY_SECRET must be set}
      NEOAVLOD_BOT_ENCRYPTION_KEY: ${NEOAVLOD_BOT_ENCRYPTION_KEY:?NEOAVLOD_BOT_ENCRYPTION_KEY must be set}
      NEOAVLOD_ADMIN_ORIGIN: ${NEOAVLOD_ADMIN_ORIGIN:-https://admin.eduneo.uz}
      NEOAVLOD_TEACHER_ORIGIN: ${NEOAVLOD_TEACHER_ORIGIN:-https://teacher.eduneo.uz}
    command: ["python", "-m", "neoavlod.cli", "worker"]
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

volumes:
  postgres-data:
  redis-data:
  media-data:
