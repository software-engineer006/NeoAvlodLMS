# Explicit opt-in; production Compose never uses this file.
services:
  demo-database:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neoavlod}
      POSTGRES_DB: neoavlod_demo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run docker_env.sh init}
    volumes:
      - demo-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d neoavlod_demo']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend:
    environment:
      NEOAVLOD_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-neoavlod}:${POSTGRES_PASSWORD}@demo-database:5432/neoavlod_demo
      NEOAVLOD_REDIS_URL: redis://redis:6379/2
      NEOAVLOD_ADMIN_ORIGIN: http://localhost:3000
      NEOAVLOD_TEACHER_ORIGIN: http://127.0.0.1:3001
    depends_on: !override
      demo-database:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: [uvicorn, neoavlod.local_demo:create_demo_app, --factory, --host, '0.0.0.0', --port, '8000', --reload]

  worker:
    image: neoavlod-backend:development
    init: true
    user: '${NEOAVLOD_UID:-1000}:${NEOAVLOD_GID:-1000}'
    volumes:
      - .:/workspace
    working_dir: /workspace/backend
    environment:
      NEOAVLOD_ENVIRONMENT: development
      NEOAVLOD_SECURITY_SECRET: ${NEOAVLOD_SECURITY_SECRET:?Run docker_env.sh init}
      NEOAVLOD_BOT_ENCRYPTION_KEY: ${NEOAVLOD_BOT_ENCRYPTION_KEY:?Run docker_env.sh init}
      NEOAVLOD_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-neoavlod}:${POSTGRES_PASSWORD}@demo-database:5432/neoavlod_demo
      NEOAVLOD_REDIS_URL: redis://redis:6379/2
      NEOAVLOD_ADMIN_ORIGIN: http://localhost:3000
      NEOAVLOD_TEACHER_ORIGIN: http://127.0.0.1:3001
    command: [python, -m, neoavlod.cli, worker]
    healthcheck:
      test: [CMD, python, -m, neoavlod.worker_health]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      demo-database:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  migrations:
    environment:
      NEOAVLOD_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-neoavlod}:${POSTGRES_PASSWORD}@demo-database:5432/neoavlod_demo
      NEOAVLOD_ADMIN_ORIGIN: http://localhost:3000
      NEOAVLOD_TEACHER_ORIGIN: http://127.0.0.1:3001
      NEOAVLOD_REDIS_URL: redis://redis:6379/2
    depends_on: !override
      demo-database:
        condition: service_healthy

  admin:
    image: node:22-bookworm-slim
    init: true
    user: '${NEOAVLOD_UID:-1000}:${NEOAVLOD_GID:-1000}'
    working_dir: /workspace/frontend
    volumes:
      - .:/workspace
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_LOCAL_DEMO: '1'
    ports:
      - '127.0.0.1:3000:3000'
    command: [npm, run, dev, --workspace=@neoavlod/admin, --, --strictPort]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  teacher:
    image: node:22-bookworm-slim
    init: true
    user: '${NEOAVLOD_UID:-1000}:${NEOAVLOD_GID:-1000}'
    working_dir: /workspace/frontend
    volumes:
      - .:/workspace
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_LOCAL_DEMO: '1'
    ports:
      - '127.0.0.1:3001:3001'
    command: [npm, run, dev, --workspace=@neoavlod/teacher, --, --strictPort]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  demo-data:
