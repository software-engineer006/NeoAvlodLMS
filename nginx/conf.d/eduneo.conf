# Upstream definition for backend API
upstream backend_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Rate and connection limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;
limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

# ==========================================
# 1. admin.eduneo.uz (Admin SPA portal)
# ==========================================
server {
    listen 80;
    listen [::]:80;
    server_name admin.eduneo.uz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.eduneo.uz;

    ssl_certificate /etc/letsencrypt/live/eduneo.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eduneo.uz/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;

    root /var/www/neoavlod/admin;
    index index.html;

    client_max_body_size 10m;

    # Hashed static assets with aggressive caching
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # API proxy for same-origin cookie security
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        limit_conn addr_limit 20;

        proxy_pass http://backend_api;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # SPA routing fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }
}

