# Install as /etc/nginx/conf.d/neoavlod-acme.conf before obtaining the first certificate.
server {
    listen 80;
    listen [::]:80;
    server_name admin.eduneo.uz teacher.eduneo.uz api.eduneo.uz;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    location / { return 404; }
}
